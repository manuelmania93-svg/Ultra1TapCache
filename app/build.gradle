plugins { id 'com.android.application' }
android {
    namespace 'at.manuel.ultra1tapcache'
    compileSdk 35
    defaultConfig {
        applicationId 'at.manuel.ultra1tapcache'
        minSdk 30
        targetSdk 35
        versionCode 12
        versionName '0.1.12-scroll-fix'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    testOptions { unitTests.includeAndroidResources = true; unitTests.all { maxHeapSize = "640m" } }
}
dependencies { androidTestImplementation 'androidx.test:runner:1.6.2'; androidTestImplementation 'androidx.test.ext:junit:1.2.1'; androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'; testImplementation 'junit:junit:4.13.2'; testImplementation 'org.robolectric:robolectric:4.14.1' }
