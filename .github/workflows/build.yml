name: Build experimental APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Materialize initial scaffold once
        if: ${{ !hashFiles('app/src/test/java/at/manuel/ultra1tapcache/MainActivityRenderTest.java') && github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import base64, tarfile, io
          payload = ''
          tarfile.open(fileobj=io.BytesIO(base64.b64decode(payload)), mode='r:gz').extractall('.', filter='data')
          PYCODE
          chmod +x gradlew
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Initialize Ultra1TapCache experiment'
          git push
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, tests and lint
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Ultra1TapCache-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Validation-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
            app/build/reports/ui/
